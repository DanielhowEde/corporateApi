# =============================================================================
# DMZ Message Exchange API - GitLab CI/CD Pipeline
# =============================================================================

stages:
  - prepare
  - lint
  - unit-test
  - build
  - sast
  - dep-scan
  - integration
  - package

default:
  image: python:3.12-slim
  tags:
    - docker

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHONDONTWRITEBYTECODE: "1"

cache:
  key: "${CI_COMMIT_REF_SLUG}-pip"
  paths:
    - .cache/pip/
    - corporate/venv/
    - low_side/venv/
    - mock_gateway/venv/
    - mock_cert_gateway/venv/

.install-corporate: &install-corporate
  before_script:
    - "mkdir -p reports"
    - "cd corporate"
    - "python -m venv venv"
    - ". venv/bin/activate"
    - "pip install --upgrade pip"
    - "pip install -r requirements.txt"

.install-low-side: &install-low-side
  before_script:
    - "mkdir -p reports"
    - "cd low_side"
    - "python -m venv venv"
    - ". venv/bin/activate"
    - "pip install --upgrade pip"
    - "pip install -r requirements.txt"

prepare:
  stage: prepare
  script:
    - 'echo "=== Validating pipeline environment ==="'
    - "python --version"
    - "pip --version"
    - 'echo "Checking project structure..."'
    - 'test -f corporate/requirements.txt || (echo "MISSING corporate/requirements.txt" && exit 1)'
    - 'test -f low_side/requirements.txt || (echo "MISSING low_side/requirements.txt" && exit 1)'
    - 'test -f mock_gateway/main.py || (echo "MISSING mock_gateway/main.py" && exit 1)'
    - 'test -f mock_cert_gateway/main.py || (echo "MISSING mock_cert_gateway/main.py" && exit 1)'
    - 'echo "=== Installing corporate dependencies ==="'
    - 'cd corporate && python -m venv venv && . venv/bin/activate && pip install --upgrade pip && pip install -r requirements.txt && deactivate && cd ..'
    - 'echo "=== Installing low-side dependencies ==="'
    - 'cd low_side && python -m venv venv && . venv/bin/activate && pip install --upgrade pip && pip install -r requirements.txt && deactivate && cd ..'
    - 'echo "=== Installing mock gateway dependencies ==="'
    - 'cd mock_gateway && python -m venv venv && . venv/bin/activate && pip install --upgrade pip && pip install fastapi uvicorn httpx && deactivate && cd ..'
    - 'echo "=== Installing mock cert gateway dependencies ==="'
    - 'cd mock_cert_gateway && python -m venv venv && . venv/bin/activate && pip install --upgrade pip && pip install -r requirements.txt && deactivate && cd ..'
    - 'echo "=== Prepare complete ==="'

lint:corporate:
  stage: lint
  <<: *install-corporate
  script:
    - "pip install ruff"
    - "ruff check app/ --output-format=gitlab"
    - "ruff format app/ --check --diff"
  allow_failure: false

lint:low-side:
  stage: lint
  <<: *install-low-side
  script:
    - "pip install ruff"
    - "ruff check app/ --output-format=gitlab"
    - "ruff format app/ --check --diff"
  allow_failure: false

lint:config-validation:
  stage: lint
  script:
    - |
      python -c "
      import ast, sys, pathlib
      errors = []
      for pattern in ['corporate/app/*.py', 'low_side/app/*.py', 'mock_gateway/*.py', 'mock_cert_gateway/*.py']:
          for f in pathlib.Path('.').glob(pattern):
              try:
                  ast.parse(f.read_text(), filename=str(f))
              except SyntaxError as e:
                  errors.append(f'{f}: {e}')
                  print(f'FAIL {f}: {e}')
              else:
                  print(f'  OK {f}')
      if errors:
          print(f'\n{len(errors)} file(s) have syntax errors')
          sys.exit(1)
      print('\nAll Python files parse successfully')
      "
    - |
      python -c "
      import json, sys, pathlib
      for f in ['corporate/config.json', 'low_side/config.json']:
          p = pathlib.Path(f)
          if p.exists():
              try:
                  json.loads(p.read_text())
                  print(f'  OK {f}')
              except json.JSONDecodeError as e:
                  print(f'FAIL {f}: {e}')
                  sys.exit(1)
      "

unit-test:corporate:
  stage: unit-test
  <<: *install-corporate
  script:
    - "pytest tests/ -v --tb=short --junitxml=../reports/corporate-unit.xml --cov=app --cov-report=term-missing --cov-report=xml:../reports/corporate-coverage.xml"
  artifacts:
    when: always
    reports:
      junit: reports/corporate-unit.xml
      coverage_report:
        coverage_format: cobertura
        path: reports/corporate-coverage.xml
    expire_in: 30 days
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'

unit-test:low-side:
  stage: unit-test
  <<: *install-low-side
  script:
    - "pytest tests/ -v --tb=short --junitxml=../reports/low-side-unit.xml --cov=app --cov-report=term-missing --cov-report=xml:../reports/low-side-coverage.xml"
  artifacts:
    when: always
    reports:
      junit: reports/low-side-unit.xml
      coverage_report:
        coverage_format: cobertura
        path: reports/low-side-coverage.xml
    expire_in: 30 days
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'

build:corporate:
  stage: build
  <<: *install-corporate
  script:
    - 'echo "=== Building corporate package ==="'
    - "pip freeze > requirements.lock"
    - "cd .."
    - "mkdir -p build"
    - "tar czf build/corporate-${CI_COMMIT_SHORT_SHA}.tar.gz corporate/app/ corporate/requirements.txt corporate/requirements.lock"
    - 'echo "Build artifact: corporate-${CI_COMMIT_SHORT_SHA}.tar.gz"'
  artifacts:
    paths:
      - build/corporate-*.tar.gz
      - corporate/requirements.lock
    expire_in: 5 days

build:low-side:
  stage: build
  <<: *install-low-side
  script:
    - 'echo "=== Building low-side package ==="'
    - "pip freeze > requirements.lock"
    - "cd .."
    - "mkdir -p build"
    - "tar czf build/low-side-${CI_COMMIT_SHORT_SHA}.tar.gz low_side/app/ low_side/requirements.txt low_side/requirements.lock"
    - 'echo "Build artifact: low-side-${CI_COMMIT_SHORT_SHA}.tar.gz"'
  artifacts:
    paths:
      - build/low-side-*.tar.gz
      - low_side/requirements.lock
    expire_in: 5 days

build:mock-services:
  stage: build
  script:
    - 'echo "=== Building mock services package ==="'
    - "mkdir -p build"
    - "tar czf build/mocks-${CI_COMMIT_SHORT_SHA}.tar.gz mock_gateway/ mock_cert_gateway/"
  artifacts:
    paths:
      - build/mocks-*.tar.gz
    expire_in: 5 days

sast:bandit:
  stage: sast
  <<: *install-corporate
  script:
    - "pip install bandit"
    - 'echo "=== Running bandit on corporate ==="'
    - "bandit -r app/ -f json -o ../reports/corporate-bandit.json --severity-level medium || true"
    - "bandit -r app/ -f screen --severity-level medium"
    - 'echo "=== Running bandit on low_side ==="'
    - "cd ../low_side"
    - "bandit -r app/ -f json -o ../reports/low-side-bandit.json --severity-level medium || true"
    - "bandit -r app/ -f screen --severity-level medium"
  artifacts:
    when: always
    paths:
      - reports/*-bandit.json
    expire_in: 30 days
  allow_failure: false

sast:sonarqube:
  stage: sast
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - "sonar-scanner -Dsonar.projectKey=${CI_PROJECT_NAME} -Dsonar.sources=corporate/app,low_side/app -Dsonar.tests=corporate/tests,low_side/tests -Dsonar.python.coverage.reportPaths=reports/corporate-coverage.xml,reports/low-side-coverage.xml -Dsonar.qualitygate.wait=true"
  rules:
    - if: '$SONAR_HOST_URL && $SONAR_TOKEN'
      when: always
    - when: never
  allow_failure: true

dep-scan:corporate:
  stage: dep-scan
  <<: *install-corporate
  script:
    - "pip install pip-audit safety"
    - 'echo "=== pip-audit (corporate) ==="'
    - "pip-audit --strict --desc on 2>&1 | tee ../reports/corporate-pip-audit.txt"
    - 'echo "=== safety check (corporate) ==="'
    - "safety check --full-report 2>&1 | tee ../reports/corporate-safety.txt || true"
    - 'test -f requirements.lock && echo "Lock file present" || echo "WARNING: no lock file"'
  artifacts:
    when: always
    paths:
      - reports/corporate-pip-audit.txt
      - reports/corporate-safety.txt
    expire_in: 30 days
  allow_failure: false

dep-scan:low-side:
  stage: dep-scan
  <<: *install-low-side
  script:
    - "pip install pip-audit safety"
    - 'echo "=== pip-audit (low-side) ==="'
    - "pip-audit --strict --desc on 2>&1 | tee ../reports/low-side-pip-audit.txt"
    - 'echo "=== safety check (low-side) ==="'
    - "safety check --full-report 2>&1 | tee ../reports/low-side-safety.txt || true"
    - 'test -f requirements.lock && echo "Lock file present" || echo "WARNING: no lock file"'
  artifacts:
    when: always
    paths:
      - reports/low-side-pip-audit.txt
      - reports/low-side-safety.txt
    expire_in: 30 days
  allow_failure: false

integration:
  stage: integration
  services: []
  variables:
    GATEWAY_URL: "http://localhost:8000"
    CERT_GATEWAY_URL: "http://localhost:8003"
    LOW_SIDE_URL: "http://localhost:8002"
    CORPORATE_URL: "http://localhost:8001"
  script:
    # Everything in one block scalar so we don't fight YAML quoting.
    - |
      set -e

      echo "=== Setup ==="
      mkdir -p reports corporate/data

      # Install each service into its own venv
      python -m venv corporate/venv
      corporate/venv/bin/pip install --quiet -r corporate/requirements.txt

      python -m venv low_side/venv
      low_side/venv/bin/pip install --quiet -r low_side/requirements.txt

      # System python used for mocks + the test harness
      pip install --quiet fastapi uvicorn httpx

      # Seed whitelist so project AAA/BBB are accepted
      printf '%s\n' '{"projects":{"AAA":{"enabled":true},"BBB":{"enabled":true}}}' \
        > corporate/data/whitelist.json
      echo "  whitelist seeded"

      echo "=== Starting services ==="
      ( cd mock_cert_gateway && python -m uvicorn main:app --host 0.0.0.0 --port 8003 >/tmp/cert-gw.log 2>&1 ) &
      ( cd mock_gateway      && python -m uvicorn main:app --host 0.0.0.0 --port 8000 >/tmp/gw.log      2>&1 ) &
      ( cd corporate         && ./venv/bin/python -m uvicorn app.main:app --host 0.0.0.0 --port 8001 >/tmp/corp.log 2>&1 ) &
      ( cd low_side          && ./venv/bin/python -m uvicorn app.main:app --host 0.0.0.0 --port 8002 >/tmp/low.log  2>&1 ) &

      echo "=== Waiting for services to become ready ==="
      for port in 8003 8000 8001 8002; do
        ready=0
        for i in $(seq 1 30); do
          if curl -sf "http://localhost:${port}/health" >/dev/null 2>&1; then
            echo "  :${port} ready"
            ready=1
            break
          fi
          sleep 1
        done
        if [ "$ready" -ne 1 ]; then
          echo "!! Port ${port} did not become ready — logs:"
          for f in /tmp/cert-gw.log /tmp/gw.log /tmp/corp.log /tmp/low.log; do
            echo "--- $f ---"; tail -40 "$f" 2>/dev/null || true
          done
          exit 1
        fi
      done

      echo "=== Health checks ==="
      curl -sf http://localhost:8003/health && echo "  cert-gw ok"
      curl -sf http://localhost:8000/health && echo "  gateway ok"
      curl -sf http://localhost:8001/health && echo "  corporate ok"
      curl -sf http://localhost:8002/health && echo "  low-side ok"

      echo "=== Integration tests ==="
      python tests/integration_suite.py
  after_script:
    - 'pkill -f "uvicorn.*8003" 2>/dev/null || true'
    - 'pkill -f "uvicorn.*8000" 2>/dev/null || true'
    - 'pkill -f "uvicorn.*8001" 2>/dev/null || true'
    - 'pkill -f "uvicorn.*8002" 2>/dev/null || true'
  rules:
    - if: '$CI_MERGE_REQUEST_IID'
      when: always
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: always
    - when: manual
  allow_failure: false

package:
  stage: package
  script:
    - 'echo "=== Packaging release artifacts ==="'
    - "mkdir -p release"
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        VERSION="$CI_COMMIT_TAG"
      else
        VERSION="${CI_COMMIT_SHORT_SHA}"
      fi
      echo "VERSION=${VERSION}" | tee release/VERSION
      tar czf "release/dmz-api-${VERSION}.tar.gz" \
        corporate/app/ \
        corporate/requirements.txt \
        low_side/app/ \
        low_side/requirements.txt \
        mock_gateway/ \
        mock_cert_gateway/ \
        cleanup.sh \
        README.md
      echo "Release artifact: dmz-api-${VERSION}.tar.gz"
    - "ls -lh release/"
  artifacts:
    paths:
      - release/
    expire_in: 90 days
  rules:
    - if: '$CI_COMMIT_TAG'
      when: always
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: always
    - when: never